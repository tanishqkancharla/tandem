name: Publish npm

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Check tag
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "v$VERSION"

      - run: pnpm install --frozen-lockfile
      - run: pnpm type-check
      - run: pnpm test
      - run: pnpm build

      - name: Publish packages
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "@tanishqkancharla/tandem-core@$VERSION" version >/dev/null 2>&1; then
            echo "Tandem $VERSION is already published"
          else
            pnpm --filter @tanishqkancharla/tandem-core publish --access public --provenance --no-git-checks
            pnpm --filter @tanishqkancharla/tandem-server publish --access public --provenance --no-git-checks
            pnpm --filter @tanishqkancharla/tandem-react publish --access public --provenance --no-git-checks
          fi
