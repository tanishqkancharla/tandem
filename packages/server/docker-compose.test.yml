services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: tandem_test
      POSTGRES_PASSWORD: postgres
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tandem_test"]
      interval: 2s
      timeout: 5s
      retries: 20

  mysql:
    image: mysql:8
    environment:
      MYSQL_DATABASE: tandem_test
      MYSQL_ROOT_PASSWORD: mysql
    ports:
      - "33069:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -pmysql"]
      interval: 2s
      timeout: 5s
      retries: 30
