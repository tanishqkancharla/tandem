<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Tandem D1 Todos</title>
		<style>
			:root {
				--bg: #f7f7f5;
				--panel: #ffffff;
				--text: #1d1d1b;
				--muted: #6b6b66;
				--border: #e2e2dc;
				--accent: #2f6fdb;
				--ok: #1f8a4c;
				--warn: #b06a00;
				color-scheme: light dark;
			}
			@media (prefers-color-scheme: dark) {
				:root {
					--bg: #161615;
					--panel: #20201e;
					--text: #ececea;
					--muted: #9a9a94;
					--border: #33332f;
					--accent: #6d9cf0;
					--ok: #4cc27f;
					--warn: #e0a040;
				}
			}
			* { box-sizing: border-box; }
			body {
				margin: 0;
				background: var(--bg);
				color: var(--text);
				font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
			}
			main { max-width: 560px; margin: 0 auto; padding: 32px 16px; }
			h1 { font-size: 1.5rem; margin: 0 0 4px; }
			.subtitle { color: var(--muted); margin: 0 0 20px; font-size: 0.9rem; }
			.status { display: flex; gap: 8px; align-items: center; font-size: 0.85rem; color: var(--muted); margin-bottom: 16px; }
			.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); }
			.status[data-state="connected"] .dot { background: var(--ok); }
			form { display: flex; gap: 8px; margin-bottom: 16px; }
			input[type="text"] {
				flex: 1; min-width: 0; padding: 10px 12px; font: inherit; color: inherit;
				background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
			}
			button {
				font: inherit; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border);
				background: var(--panel); color: inherit; cursor: pointer;
			}
			button[type="submit"] { background: var(--accent); border-color: var(--accent); color: #fff; }
			ul:empty { display: none; }
			ul { list-style: none; margin: 0; padding: 0; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; }
			li { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-top: 1px solid var(--border); }
			li:first-child { border-top: none; }
			li label { flex: 1; display: flex; gap: 10px; align-items: center; min-width: 0; overflow-wrap: anywhere; }
			li[data-done="true"] label span { color: var(--muted); text-decoration: line-through; }
			li button { padding: 4px 10px; font-size: 0.85rem; }
			.empty { padding: 16px; color: var(--muted); text-align: center; }
			.error { color: var(--warn); }
		</style>
	</head>
	<body>
		<main>
			<h1>Shared todos</h1>
			<p class="subtitle">Stored in D1. Synced through a Tandem Durable Object coordinator.</p>
			<div class="status" id="status" data-state="connecting"><span class="dot"></span><span id="status-text">Connecting…</span></div>
			<form id="add">
				<input type="text" id="title" aria-label="New todo" placeholder="Add a todo" maxlength="500" required />
				<button type="submit">Add</button>
			</form>
			<ul id="todos" aria-label="Todos"></ul>
		</main>
		<script type="module" src="/app.js"></script>
	</body>
</html>
